# Every figure the decisions cite, with the file it was measured in. The lab's results are
# this repository's own (lab/, results/); the rest come from the labs named in `repo`.

aia_semantic_llama:
  value: "55 → 70 of 70"
  label: "customers' questions answered correctly by Llama 3.3 70B, from the table definitions alone and with the semantic layer"
  method: "70 answerable questions (24 templates, each asked for different accounts) with reference answers computed by SQL on a reproducible generated usage mart; the model writes one PostgreSQL query, run as the customer's own role, with the prompt's today (2026-10-01) pinned for CURRENT_DATE and now(); the reference value must be in the first row, numbers to one decimal"
  repo: ai-platform-architecture
  file: results/assistant.json

aia_semantic_qwen:
  value: "46 → 64 of 70"
  label: "the same questions answered correctly by Qwen3 8B, run locally, without and with the semantic layer"
  method: "as above; Ollama on one host (Apple M5, 24 GB), temperature 0, thinking off"
  repo: ai-platform-architecture
  file: results/assistant.json

aia_unanswerable:
  value: "20 of 20"
  label: "questions the data cannot answer that gpt-oss-120b declined, with the semantic layer"
  method: "10 questions about billing, sessions, personal data, tickets and predictions, each asked for two accounts; a declined answer is UNANSWERABLE with no query"
  repo: ai-platform-architecture
  file: results/assistant.json

aia_prompt_isolation:
  value: "23 of 120"
  label: "requests for another account's data that leaked when isolation was left to the prompt"
  method: "20 prompts asking for another account's or every account's data, each from two customers, to three models told to answer only about the customer's account; the generated query run with access to every account and as the customer's role, a leak being any difference. Llama 3.3 70B leaked with 12 of the 12 queries it wrote"
  repo: ai-platform-architecture
  file: results/assistant.json

aia_db_isolation:
  value: "0 of 28"
  label: "queries that reached the database (of the 120 requests; the rest were declined) and returned another account's data, run as the customer's own database role"
  method: "one read-only login role per account, row-level security on every table keyed on the session's login role; each role sees 1 of the 200 accounts"
  repo: ai-platform-architecture
  file: results/assistant.json

aia_genie_accuracy:
  value: "69 of 70"
  label: "questions Databricks AI/BI Genie answered correctly with the same definitions as instructions; median 14.5 s"
  method: "the mart's tables copied to Unity Catalog; a Genie space whose instructions and examples are the semantic layer; each question asked as 'I am account N.' through the Conversation API, polled every 3 s until it completes, and its query result scored with the same checker; each timing includes up to 3 s of polling"
  repo: ai-platform-architecture
  file: results/assistant-genie.json

aia_genie_precedence:
  value: "1,570 vs 12"
  label: "people Genie counted for one customer's mobile users, against the right answer: a missing pair of parentheses counted every account's Android users"
  method: "WHERE account_id = 132 AND platform ILIKE '%ios%' OR platform ILIKE '%android%' AND …, run with access to every account, as the lab's Genie space was"
  repo: ai-platform-architecture
  file: results/assistant-genie-responses.jsonl

aia_cost_per_answer:
  value: "$0.00032"
  label: "per answer on gpt-oss-120b at Databricks' pay-per-token list price in the company's EU region, from measured tokens; p95 5.5 s"
  method: "mean 1,094 input and 198 output tokens (reasoning included) over the 90 questions with the semantic layer; 2.143 and 8.571 DBU per million tokens at $0.078 a DBU, AWS EU (Ireland), from the platform's system.billing.list_prices ($0.07 in US East)"
  repo: ai-platform-architecture
  file: results/assistant.json

aia_replay:
  value: "660"
  label: "recorded model responses re-scored in CI against a fresh mart, with no model called"
  method: "every response is stored with a hash of its prompt; replay re-runs extraction, execution as the customer's role and scoring, and must reproduce results/assistant.json"
  repo: ai-platform-architecture
  file: results/assistant-responses.jsonl

evalproof_noise_gate:
  value: "p = 0.39"
  label: "for a 4.8-point judge drop the gate declined to fail"
  method: "exact McNemar on 83 paired cases \u2014 8 worse, 4 better, 71 unchanged \u2014 qwen3:1.7b judged by qwen3:8b on Ollama, temperature 0"
  repo: evalproof
  file: MEASUREMENTS.md

evalproof_latency_p95:
  value: "1,469 \u2192 4,422 ms"
  label: "p95 latency, the regression that was real"
  method: "system latency over the same 83 cases, sequential, one Apple M5; mean answer length went from 19 to 77 tokens"
  repo: evalproof
  file: MEASUREMENTS.md

evalproof_gold_errors:
  value: "7 vs 4"
  label: "judge\u2013key disagreements where the key, not the judge, was wrong"
  method: "all 13 disagreements across both runs read by hand; 2 were ambiguous"
  repo: evalproof
  file: MEASUREMENTS.md

evalproof_reasoning_fpr:
  value: "5.9% → 0.0%"
  label: "false-positive rate of the judge on the baseline run, thinking off against thinking on"
  method: "the same qwen3:8b judge on cached answers, scored against labels audited case by case wherever the answer key and the two judges disagreed (22 cases); thinking took 6.7 times the judge time (1,338 s against 201 s for 83 verdicts)"
  repo: evalproof
  file: MEASUREMENTS.md

evalproof_determinism:
  value: "20 of 20"
  label: "cases with identical outputs, verdicts and judge reasons when re-run with the cache off"
  method: "temperature 0 and seed 0 on local models through Ollama 0.23.2; checked on this backend only"
  repo: evalproof
  file: MEASUREMENTS.md

agent_replay:
  value: "54 of 54"
  label: "cases where replaying the recorded model reproduced the live run's output"
  method: "the live run's model responses recorded once and replayed in CI, so tests and the eval gate run with no model"
  repo: governed-agent
  file: MEASUREMENTS.md

aia_rewrite_attacks:
  value: "28 of 28"
  label: "queries the models wrote for the isolation attacks that the tool's rewrite scoped to the customer's rows, exactly as row-level security did, including the 23 that leaked through the prompt"
  method: "each recorded query parsed with sqlglot, refused unless it reads only the three permitted tables unqualified, then given per-account common table expressions with the same names and run as a role that reads every account; compared with the same query run as the customer's own role"
  repo: ai-platform-architecture
  file: results/assistant-rewrite.json

aia_rewrite_ordinary:
  value: "436 of 436"
  label: "queries for ordinary questions whose result the rewrite left exactly as row-level security gave it, none refused"
  method: "every recorded query from the three models, with and without the semantic layer, rewritten and compared as above"
  repo: ai-platform-architecture
  file: results/assistant-rewrite.json

aia_rewrite_escapes:
  value: "44 of 44"
  label: "hand-written escapes refused by the hardened, default-deny rewrite; the first version of the rewrite (commit 2b80533) accepted 23 of them"
  method: "44 hand-written queries in lab/escapes.yml, shaped to look like usage questions but instead running SQL of their own (query_to_xml, table_to_xml, ts_stat and similar), casting to a catalog type, naming a schema, or redefining a scoped table name inside a nested CTE reaching tenant_roles or pg_class; each parsed with sqlglot and must be refused. The same file's 13 ordinary shapes must still be scoped and identical to row-level security"
  repo: ai-platform-architecture
  file: results/assistant-rewrite.json

aia_rls_catalog:
  value: "1,935"
  label: "users in every account, read from pg_class.reltuples by the customer's own row-level-security role, which counted only 14 users of its own; the rewrite refuses the query"
  method: "SELECT reltuples FROM pg_class WHERE relname = 'users' AND relnamespace = 'usage'::regnamespace, run as the customer's role, against SELECT count(*) FROM users by the same role; row-level security filters rows, not the catalog"
  repo: ai-platform-architecture
  file: results/assistant-rewrite.json

dpa_session_variable_filter:
  value: "UNRESOLVED_COLUMN"
  label: "what Databricks returns for a row filter function that reads a session variable: a per-request value cannot scope rows"
  method: "Databricks SQL 2026.39 on Free Edition: DECLARE VARIABLE request_account, then CREATE FUNCTION … RETURN account_id = request_account; the same function keyed on current_user() through a mapping table scoped a table to 1 of 5 accounts"
  repo: data-platform-architecture
  file: results/poc-databricks.json
