# The usage assistant (docs/01-brief.md): its token counts are measured in lab/ (the mean
# over every question for gpt-oss-120b with the semantic layer, results/assistant.json);
# its question volumes are the brief's assumptions.
features:
  usage_assistant:
    description: "one customer question: one model call writes the SQL; the answer is composed from the rows without a second call"
    calls_per_answer: 1
    input_tokens_per_call: 1094   # measured: system prompt, schema, semantic layer, question
    output_tokens_per_call: 198   # measured: includes the reasoning model's reasoning tokens
    answers_per_month: {launch: 60000, month_12: 150000, month_36: 600000}

# The feature whose per-answer price sets the self-hosting break-even.
break_even_feature: usage_assistant

# Where the assistant's SQL runs, if on the analytical platform: a warehouse has to be awake
# whenever a customer may ask. Its size and rate are measured (the smallest one ran the
# usage queries in seconds); how many hours it is awake is the assumption. The ceiling is
# the brief's (A6).
query_engine:
  hours_awake_per_month: {eu_working_hours: 264, always: 730}   # 12 h × 22 days; 24 × 30.4
  ceiling_usd_per_month: 1500
