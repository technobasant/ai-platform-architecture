# The usage mart the assistant reads, as stage 1 of the data platform publishes it, in a
# local Postgres with one login role per customer account. Local only: trust
# authentication, bound to localhost.
name: ai-assistant-lab

services:
  mart:
    # postgres:17-bookworm, PostgreSQL 17.11: the same digest CI pins in .github/workflows/ci.yml
    image: postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./:/lab:ro
      - mart-data:/var/lib/postgresql/data
    ports: ["127.0.0.1:55442:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 60

volumes:
  mart-data:
