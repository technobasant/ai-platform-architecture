[project]
name = "ai-platform-architecture"
version = "0.3.0"
description = "The AI architecture for a B2B SaaS company's usage assistant, a scenario common across the industry: measured accuracy, isolation and cost, and decisions with evidence."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Basant Bhattarai" }]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "httpx>=0.28"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]
lab = ["psycopg[binary]==3.3.6", "sqlglot==30.24.0"]

[tool.uv]
package = false
exclude-newer = "3 days"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
